<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>站长后台 · 留言与在线客服</title>
<style>
  :root {
    --bg: #14161A; --card: #1E2127; --line: #2C3038; --text: #E8EAED;
    --muted: #9AA0A6; --accent: #4CAF7D; --danger: #D96C5F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    line-height: 1.7; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 24px 80px; }
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }

  .login-box {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 28px; max-width: 420px;
  }
  .login-box input {
    width: 100%; font: inherit; font-size: 15px; color: var(--text);
    padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: #14161A; outline: none; margin-bottom: 14px;
  }
  .login-box input:focus { border-color: var(--accent); }
  .btn {
    font: inherit; font-size: 14px; cursor: pointer;
    padding: 10px 20px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); transition: .15s;
  }
  .btn:hover { border-color: #3A3F48; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0D1117; }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab {
    font: inherit; font-size: 14px; cursor: pointer; padding: 9px 20px;
    border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted);
  }
  .tab.active { background: var(--card); color: var(--text); border-color: #3A3F48; }

  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; flex-wrap: wrap; }
  .bar .count { font-size: 13px; color: var(--muted); }

  .msg {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 22px; margin-bottom: 14px;
  }
  .msg .head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
  .msg .who { font-size: 15px; font-weight: 500; }
  .msg .meta { font-size: 12px; color: var(--muted); }
  .badge {
    display: inline-block; font-size: 12px; padding: 1px 10px; border-radius: 999px;
    margin-left: 8px; vertical-align: 1px;
  }
  .badge.pending { background: #4A3F22; color: #D9B95C; }
  .badge.approved { background: #1F3D2E; color: #6FCF97; }
  .msg .body { font-size: 14px; margin-top: 8px; white-space: pre-wrap; word-break: break-word; }
  .msg .ops { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--muted); font-size: 14px; padding: 48px 0; }
  #err { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; }

  /* 在线客服 */
  .chat-layout { display: grid; grid-template-columns: 280px 1fr; gap: 14px; min-height: 480px; }
  @media (max-width: 680px) { .chat-layout { grid-template-columns: 1fr; } }
  .conv-list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow-y: auto; max-height: 560px; }
  .conv {
    padding: 13px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: .12s;
  }
  .conv:hover { background: #23262D; }
  .conv.active { background: #243B31; }
  .conv .c-top { display: flex; justify-content: space-between; gap: 8px; }
  .conv .c-name { font-size: 14px; font-weight: 500; }
  .conv .c-time { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .conv .c-preview { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv .c-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 6px; }
  .chat-pane {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    display: flex; flex-direction: column; max-height: 560px; overflow: hidden;
  }
  .chat-pane .cp-head { padding: 12px 18px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .cp-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .cl { display: flex; flex-direction: column; max-width: 80%; }
  .cl.me { align-self: flex-end; align-items: flex-end; }
  .cl .c-bubble { font-size: 14px; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .cl .c-bubble.hasimg { padding: 5px; background: #F2F4F6; }
  .cl .c-bubble img { display: block; max-width: 240px; max-height: 240px; border-radius: 8px; cursor: zoom-in; }
  .cl:not(.me) .c-bubble { background: #262A31; border-top-left-radius: 4px; }
  .cl.me .c-bubble { background: var(--accent); color: #0D1117; border-top-right-radius: 4px; }
  .cl .c-name { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .cp-foot { border-top: 1px solid var(--line); padding: 12px; display: flex; gap: 10px; }
  .cp-foot input {
    flex: 1; font: inherit; font-size: 14px; color: var(--text);
    padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px;
    background: #14161A; outline: none;
  }
  .cp-foot input:focus { border-color: var(--accent); }
  .cp-hint { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>站长后台</h1>
  <div class="sub">留言审核 · 在线客服，都在这里</div>

  <div class="login-box" id="loginBox">
    <input type="password" id="secret" placeholder="输入管理口令" autocomplete="off">
    <button class="btn primary" id="loginBtn">进入后台</button>
    <div id="err"></div>
  </div>

  <div id="admin" style="display:none">
    <div class="tabs">
      <button class="tab active" id="tabGb">留言管理</button>
      <button class="tab" id="tabChat">在线客服</button>
    </div>

    <!-- 留言 -->
    <div id="gbView">
      <div class="bar">
        <span class="count" id="count"></span>
        <button class="btn" id="refreshBtn">刷新</button>
      </div>
      <div id="list"></div>
    </div>

    <!-- 聊天 -->
    <div id="chatView" style="display:none">
      <div class="bar">
        <span class="count" id="chatStatus"></span>
        <button class="btn" id="chatRefreshBtn">刷新会话</button>
      </div>
      <div class="chat-layout">
        <div class="conv-list" id="convList"><div class="empty">暂无会话</div></div>
        <div class="chat-pane" id="chatPane" style="display:none">
          <div class="cp-head" id="cpHead"></div>
          <div class="cp-body" id="cpBody"></div>
          <div class="cp-foot">
            <input type="text" id="replyText" maxlength="500" placeholder="输入回复，回车发送…">
            <button class="btn primary" id="replyBtn">发送</button>
          </div>
        </div>
        <div class="chat-pane" id="chatPaneEmpty"><div class="cp-hint">← 选择左侧会话开始回复</div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://bbsdqtxxxcfymxnmlfkb.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_0FPyxY2UFV8e7W3Ff9nPyg_qE2eTWH9";
  const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const db = supa;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let secret = sessionStorage.getItem("gb_admin_secret") || "";

  function fmtTime(ts, withClock) {
    const d = new Date(ts);
    if (isNaN(d)) return "";
    const p = (n) => String(n).padStart(2, "0");
    const base = d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
    return withClock ? base + " " + p(d.getHours()) + ":" + p(d.getMinutes()) : base;
  }
  function showErr(text) { const el = $("err"); el.style.display = "block"; el.textContent = text; }
  function hideErr() { $("err").style.display = "none"; }

  /* ===== 标签切换 ===== */
  let gbTimer = null, convTimer = null, msgTimer = null;
  function switchTab(chat) {
    $("tabGb").classList.toggle("active", !chat);
    $("tabChat").classList.toggle("active", chat);
    $("gbView").style.display = chat ? "none" : "block";
    $("chatView").style.display = chat ? "block" : "none";
    if (gbTimer) { clearInterval(gbTimer); gbTimer = null; }
    if (convTimer) { clearInterval(convTimer); convTimer = null; }
    stopMsgTimer();
    if (chat) { loadConvs(); convTimer = setInterval(loadConvs, 5000); }
    else loadList();
  }
  $("tabGb").addEventListener("click", () => switchTab(false));
  $("tabChat").addEventListener("click", () => switchTab(true));

  /* ===== 留言管理 ===== */
  async function loadList() {
    const { data, error } = await db.rpc("admin_list_messages", { p_secret: secret });
    if (error) return authFail(error);
    const rows = data || [];
    $("count").textContent = "共 " + rows.length + " 条留言（待确认 " + rows.filter((m) => m.status !== "approved").length + " 条）";
    $("list").innerHTML = rows.length === 0
      ? '<div class="empty">还没有收到留言</div>'
      : rows.map((m) => (
        '<div class="msg"><div class="head">' +
        '<span class="who">' + esc(m.name || "匿名朋友") +
        '<span class="badge ' + esc(m.status) + '">' + (m.status === "approved" ? "已展示" : "待确认") + "</span></span>" +
        '<span class="meta">' + fmtTime(m.created_at, true) + "</span></div>" +
        '<div class="body">' + esc(m.content) + "</div>" +
        (m.contact ? '<div class="meta" style="margin-top:6px">联系方式：' + esc(m.contact) + "</div>" : "") +
        '<div class="ops">' +
        (m.status === "approved"
          ? '<button class="btn" onclick="setStatus(' + m.id + ", 'pending')\">撤下展示</button>"
          : '<button class="btn primary" onclick="setStatus(' + m.id + ", 'approved')\">通过并展示</button>") +
        '<button class="btn danger" onclick="removeMsg(' + m.id + ')">删除</button>' +
        "</div></div>"
      )).join("");
  }
  async function setStatus(id, status) {
    const { error } = await db.rpc("admin_set_message_status", { p_secret: secret, p_id: id, p_status: status });
    if (error) return showErr("操作失败：" + (error.message || "未知错误"));
    loadList();
  }
  async function removeMsg(id) {
    if (!confirm("确定删除这条留言吗？删除后不可恢复。")) return;
    const { error } = await db.rpc("admin_delete_message", { p_secret: secret, p_id: id });
    if (error) return showErr("删除失败：" + (error.message || "未知错误"));
    loadList();
  }

  /* ===== 在线客服 ===== */
  let activeConv = null;
  let msgLastId = 0;

  function stopMsgTimer() { if (msgTimer) { clearInterval(msgTimer); msgTimer = null; } }

  async function loadConvs() {
    const { data, error } = await db.rpc("admin_chat_convs", { p_secret: secret });
    if (error) return authFail(error);
    const rows = data || [];
    $("chatStatus").textContent = "共 " + rows.length + " 个会话";
    $("convList").innerHTML = rows.length === 0
      ? '<div class="empty">还没有访客发起聊天<br>访客从主页右下角「在线客服」进入</div>'
      : rows.map((c) => (
        '<div class="conv' + (c.conv_id === activeConv ? " active" : "") + '" onclick="openConv(\'' + c.conv_id + '\')">' +
        '<div class="c-top"><span class="c-name">' + (c.last_sender === "visitor" ? '<span class="c-dot"></span>' : "") + esc(c.visitor_name || "访客") + "</span>" +
        '<span class="c-time">' + fmtTime(c.last_time) + "</span></div>" +
        '<div class="c-preview">' + esc(c.last_content || "") + "</div></div>"
      )).join("");
  }

  async function openConv(convId) {
    activeConv = convId;
    msgLastId = 0;
    stopMsgTimer();
    $("convList").querySelectorAll(".conv").forEach((el) => el.classList.remove("active"));
    loadConvs();
    $("chatPaneEmpty").style.display = "none";
    $("chatPane").style.display = "flex";
    $("cpBody").innerHTML = "";
    await pullMsgs(true);
    msgTimer = setInterval(() => pullMsgs(false), 3000);
  }

  async function pullMsgs(scroll) {
    if (!activeConv) return;
    const { data, error } = await db.rpc("admin_chat_pull", { p_secret: secret, p_conv_id: activeConv, p_after_id: msgLastId });
    if (error) return;
    if (!data || data.length === 0) return;
    const body = $("cpBody");
    const nearBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 60;
    data.forEach((m) => {
      const me = m.sender === "admin";
      let inner = "";
      if (m.image) {
        const src = m.image.startsWith("data:") ? m.image : "data:image/jpeg;base64," + m.image;
        inner += '<span class="c-bubble hasimg"><img src="' + src + '" alt="图片" onclick="window.open(this.src)"></span>';
      }
      if (m.content) inner += '<span class="c-bubble">' + esc(m.content) + "</span>";
      if (!inner) return;
      body.insertAdjacentHTML("beforeend",
        '<div class="cl' + (me ? " me" : "") + '" style="gap:4px">' +
        '<span class="c-name">' + esc(me ? "站长" : (m.sender_name || "访客")) + "</span>" + inner + "</div>");
      msgLastId = Math.max(msgLastId, m.id);
    });
    if (nearBottom || scroll) body.scrollTop = body.scrollHeight;
  }

  async function sendReply() {
    const text = $("replyText").value.trim();
    if (!text || !activeConv) return;
    const { error } = await db.rpc("admin_chat_reply", { p_secret: secret, p_conv_id: activeConv, p_content: text });
    if (error) return showErr("发送失败：" + (error.message || "未知错误"));
    $("replyText").value = "";
    await pullMsgs(false);
    loadConvs();
  }
  $("replyBtn").addEventListener("click", sendReply);
  $("replyText").addEventListener("keydown", (e) => { if (e.key === "Enter") sendReply(); });

  /* ===== 登录与启动 ===== */
  function authFail(error) {
    const msg = error && (error.message || "");
    if (msg === "forbidden") {
      sessionStorage.removeItem("gb_admin_secret");
      secret = "";
      $("loginBox").style.display = "block";
      $("admin").style.display = "none";
      stopMsgTimer();
      if (convTimer) { clearInterval(convTimer); convTimer = null; }
      showErr("口令不对，请重新输入。");
    } else {
      showErr("服务暂时不可用，请稍后刷新重试。");
    }
  }

  $("loginBtn").addEventListener("click", () => {
    secret = $("secret").value.trim();
    if (!secret) return showErr("请输入口令");
    hideErr();
    sessionStorage.setItem("gb_admin_secret", secret);
    $("loginBox").style.display = "none";
    $("admin").style.display = "block";
    loadList();
  });
  $("secret").addEventListener("keydown", (e) => { if (e.key === "Enter") $("loginBtn").click(); });
  $("refreshBtn").addEventListener("click", loadList);
  $("chatRefreshBtn").addEventListener("click", loadConvs);

  if (secret) {
    $("loginBox").style.display = "none";
    $("admin").style.display = "block";
    loadList();
  }
</script>
</body>
</html>
